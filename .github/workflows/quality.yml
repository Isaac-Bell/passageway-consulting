name: Passageway quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: passageway-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test the production site
        run: npm test

      - name: Retain the deployable main artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: passageway-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
